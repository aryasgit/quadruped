<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Quadruped Controller</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#161a24; --panel2:#1e2432; --line:#2a3142;
    --txt:#eef2f8; --dim:#8b93a7; --accent:#6ea8ff; --accent2:#31c48d;
    --danger:#ef4444; --warn:#f5a524;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--txt);
    overflow:hidden; touch-action:none; user-select:none;
    display:flex; flex-direction:column;
  }

  /* HEADER */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  .title{font-weight:700; letter-spacing:.3px; font-size:16px;}
  .title small{color:var(--dim); font-weight:500;}
  .status{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--danger);}
  .status .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);
    box-shadow:0 0 0 0 rgba(239,68,68,.5);}
  .status.connected{color:var(--accent2);}
  .status.connected .dot{background:var(--accent2); animation:pulse 2s infinite;}
  .status.reconnecting{color:var(--warn);}
  .status.reconnecting .dot{background:var(--warn);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(49,196,141,.5);}70%{box-shadow:0 0 0 8px rgba(49,196,141,0);}100%{box-shadow:0 0 0 0 rgba(49,196,141,0);}}

  /* TABS */
  .tabs{display:flex; background:var(--panel); border-bottom:1px solid var(--line);}
  .tab{flex:1; padding:14px; text-align:center; background:transparent; border:none;
    color:var(--dim); font-weight:700; font-size:14px; border-bottom:3px solid transparent;}
  .tab.active{color:var(--txt); border-bottom-color:var(--accent);}

  /* VIEWS */
  .view{display:none; flex:1; min-height:0;}
  .view.active{display:flex;}

  /* DRIVE */
  .drive{flex-direction:column; padding:10px;}
  .pads{flex:1; display:flex; align-items:center; justify-content:space-around; gap:10px;}
  .pad{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .pad .label{font-size:12px; color:var(--dim); font-weight:700; letter-spacing:1px;}
  .joystick{
    width:42vw; height:42vw; max-width:300px; max-height:300px;
    border-radius:50%; position:relative; touch-action:none;
    background:radial-gradient(circle at center, var(--panel2), var(--panel));
    border:1px solid var(--line);
  }
  .joystick::before{content:""; position:absolute; inset:18%; border-radius:50%;
    border:1px dashed rgba(255,255,255,.08);}
  .stick{
    width:34%; height:34%; border-radius:50%; position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%); margin:0; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, #8fbcff, var(--accent));
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .readout{display:flex; justify-content:space-around; gap:8px; padding:8px 4px 2px;}
  .readout div{font-size:12px; color:var(--dim);}
  .readout b{color:var(--txt); font-variant-numeric:tabular-nums;}

  /* ACTIONS */
  .actions{flex-direction:column; overflow-y:auto; padding:14px; gap:16px;}
  .group{}
  .group h3{margin:0 0 8px; font-size:12px; color:var(--dim);
    text-transform:uppercase; letter-spacing:1.2px;}
  .grid{display:grid; gap:10px;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  button.btn{
    padding:16px 8px; font-size:15px; font-weight:600; border-radius:14px; border:1px solid var(--line);
    background:var(--panel2); color:var(--txt); display:flex; flex-direction:column;
    align-items:center; gap:3px; transition:transform .05s, background .1s;
  }
  button.btn .sub{font-size:11px; color:var(--dim); font-weight:500;}
  button.btn:active{transform:scale(.95); background:var(--accent); border-color:var(--accent);}
  button.btn:active .sub{color:rgba(255,255,255,.85);}
  button.btn.hold{background:#20283a;}
  button.warn:active{background:var(--warn); border-color:var(--warn);}
  button.danger{background:#2a1a1e; border-color:#5b2b30; color:#ffb4b4;}
  button.danger:active{background:var(--danger); border-color:var(--danger); color:#fff;}

  .tiltbtn{margin:6px 8px 2px; padding:14px; width:calc(100% - 16px); border-radius:14px;
    border:1px solid var(--line); background:var(--panel2); color:var(--txt);
    font-size:15px; font-weight:600; display:flex; flex-direction:column; gap:3px; align-items:center;}
  .tiltbtn .hint{font-size:11px; color:var(--dim); font-weight:500;}
  .tiltbtn.on{background:linear-gradient(90deg,#173a2c,#1c4a38); border-color:var(--accent2); color:#c9ffe8;}
  .tiltbtn.on .hint{color:#8fe6c2;}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">Quadruped <small>Controller</small></div>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
</div>

<div class="tabs">
  <button class="tab active" data-view="drive">🕹️ Drive</button>
  <button class="tab" data-view="actions">✨ Actions</button>
</div>

<!-- DRIVE -->
<div id="drive" class="view drive active">
  <div class="pads">
    <div class="pad">
      <div class="label">MOVE</div>
      <div class="joystick" id="left"><div class="stick"></div></div>
    </div>
    <div class="pad">
      <div class="label">TURN</div>
      <div class="joystick" id="right"><div class="stick"></div></div>
    </div>
  </div>
  <div class="readout">
    <div>fwd <b id="rFwd">0.00</b></div>
    <div>strafe <b id="rStrafe">0.00</b></div>
    <div>turn <b id="rTurn">0.00</b></div>
  </div>
  <button id="tiltBtn" class="tiltbtn">📱 Gyro Tilt: OFF <span class="hint">tilt any direction · stationary only</span></button>
</div>

<!-- ACTIONS -->
<div id="actions" class="view actions">
  <div class="group">
    <h3>Move (single step)</h3>
    <div class="grid g3">
      <button class="btn hold" data-cmd="w">↑<span class="sub">Forward</span></button>
      <button class="btn hold" data-cmd="q">↺<span class="sub">Turn L</span></button>
      <button class="btn hold" data-cmd="e">↻<span class="sub">Turn R</span></button>
      <button class="btn hold" data-cmd="a">←<span class="sub">Left</span></button>
      <button class="btn hold" data-cmd="s">↓<span class="sub">Back</span></button>
      <button class="btn hold" data-cmd="d">→<span class="sub">Right</span></button>
    </div>
  </div>

  <div class="group">
    <h3>Tricks</h3>
    <div class="grid g3">
      <button class="btn" data-cmd="1">🐾<span class="sub">Shake</span></button>
      <button class="btn" data-cmd="2">🙇<span class="sub">Bow</span></button>
      <button class="btn" data-cmd="3">🍑<span class="sub">Wiggle</span></button>
      <button class="btn" data-cmd="4">💪<span class="sub">Push-ups</span></button>
      <button class="btn" data-cmd="5">🙏<span class="sub">Bheek</span></button>
      <button class="btn" data-cmd="6">✋<span class="sub">High-five</span></button>
      <button class="btn" data-cmd="7">🐕<span class="sub">Sit</span></button>
      <button class="btn" data-cmd="8">🧘<span class="sub">Stretch</span></button>
      <button class="btn" data-cmd="9">💃<span class="sub">Tilt dance</span></button>
      <button class="btn" data-cmd="0">🎬<span class="sub">Combo</span></button>
    </div>
  </div>

  <div class="group">
    <h3>System</h3>
    <div class="grid g3">
      <button class="btn" data-cmd="c">📐<span class="sub">Height</span></button>
      <button class="btn warn" data-cmd="p">🛡️<span class="sub">Stability</span></button>
      <button class="btn danger" data-cmd="x">⏹<span class="sub">Stop</span></button>
    </div>
  </div>
</div>

<script>
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
let ws = null;
let axes = { fwd:0, strafe:0, turn:0 };

/* --- connection with AUTO-RECONNECT (bug fix: old UI never retried) --- */
function setStatus(cls, text){ statusEl.className = "status " + cls; statusText.textContent = text; }

function connect(){
  setStatus("reconnecting", "connecting…");
  const wsProto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${wsProto}://${location.host}/ws`);
  ws.onopen  = () => setStatus("connected", "connected");
  ws.onclose = () => { setStatus("reconnecting", "reconnecting…"); setTimeout(connect, 1000); };
  ws.onerror = () => { try{ ws.close(); }catch(e){} };
}
function send(obj){ if(ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
connect();

/* --- tabs --- */
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.getElementById(t.dataset.view).classList.add("active");
    t.classList.add("active");
  };
});

/* --- command buttons --- */
document.querySelectorAll("[data-cmd]").forEach(btn=>{
  btn.addEventListener("click", ()=> send({type:"command", cmd:btn.dataset.cmd}));
});

/* --- readout --- */
const rFwd=document.getElementById("rFwd"), rStrafe=document.getElementById("rStrafe"), rTurn=document.getElementById("rTurn");
function updateReadout(){ rFwd.textContent=axes.fwd.toFixed(2); rStrafe.textContent=axes.strafe.toFixed(2); rTurn.textContent=axes.turn.toFixed(2); }

/* --- joysticks --- */
function makeJoy(el, type){
  const stick = el.querySelector(".stick");
  let active = false;

  function update(e){
    const r = el.getBoundingClientRect();
    let dx = (e.clientX - (r.left + r.width/2)) / (r.width/2);
    let dy = (e.clientY - (r.top + r.height/2)) / (r.height/2);
    dx = Math.max(-1, Math.min(1, dx));
    dy = Math.max(-1, Math.min(1, dy));
    stick.style.transform = `translate(-50%,-50%) translate(${dx*70}%, ${dy*70}%)`;
    if(type === "left"){ axes.fwd = -dy; axes.strafe = dx; }
    else               { axes.turn = dx; }
    updateReadout();
    send({type:"axis", ...axes});
  }

  el.addEventListener("pointerdown", (e)=>{ active=true; el.setPointerCapture(e.pointerId); update(e); });
  el.addEventListener("pointermove", (e)=>{ if(active) update(e); });

  function stop(){
    active = false;
    stick.style.transform = "translate(-50%,-50%)";
    /* BUG FIX: reset ONLY this stick's axes. The old UI zeroed ALL axes on
       either stick's release, so letting go of Turn also stopped walking. */
    if(type === "left"){ axes.fwd = 0; axes.strafe = 0; }
    else               { axes.turn = 0; }
    updateReadout();
    send({type:"axis", ...axes});
  }
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
  el.addEventListener("lostpointercapture", stop);
}
makeJoy(document.getElementById("left"), "left");
makeJoy(document.getElementById("right"), "right");

/* --- gyro tilt: mirror phone side-to-side (roll) onto the robot when idle --- */
const tiltBtn = document.getElementById("tiltBtn");
const TILT_MAX_DEG = 30;          // phone tilt (deg) that maps to full lean
let tiltOn = false, tiltTimer = null;
let curRoll = 0, curPitch = 0, refG = null, refB = null;

function onOrient(e){
  // gamma = left/right tilt (roll), beta = front/back tilt (pitch), degrees.
  const g = e.gamma || 0, b = e.beta || 0;
  if(refG === null){ refG = g; refB = b; }        // first reading becomes "level"
  curRoll  = Math.max(-1, Math.min(1, (g - refG) / TILT_MAX_DEG));   // + = right
  curPitch = Math.max(-1, Math.min(1, (b - refB) / TILT_MAX_DEG));   // + = nose down
}

async function enableTilt(){
  // iOS 13+ needs an explicit permission request from a user gesture
  if(typeof DeviceOrientationEvent !== "undefined" &&
     typeof DeviceOrientationEvent.requestPermission === "function"){
    try{
      const res = await DeviceOrientationEvent.requestPermission();
      if(res !== "granted"){ alert("Motion access denied — can't use gyro tilt."); return false; }
    }catch(err){ alert("Motion access error: " + err); return false; }
  }
  refG = refB = null;             // recapture neutral each time it's enabled
  window.addEventListener("deviceorientation", onOrient);
  tiltTimer = setInterval(()=> send({type:"tilt", roll: curRoll, pitch: curPitch}), 40);  // ~25 Hz
  return true;
}
function disableTilt(){
  window.removeEventListener("deviceorientation", onOrient);
  if(tiltTimer){ clearInterval(tiltTimer); tiltTimer = null; }
  curRoll = curPitch = 0;
  send({type:"tilt", roll: 0, pitch: 0});
}
tiltBtn.addEventListener("click", async ()=>{
  if(!tiltOn){
    const ok = await enableTilt();
    if(!ok) return;
    tiltOn = true; tiltBtn.classList.add("on");
    tiltBtn.innerHTML = '📱 Gyro Tilt: ON <span class="hint">tilt any direction · stationary only</span>';
  } else {
    disableTilt();
    tiltOn = false; tiltBtn.classList.remove("on");
    tiltBtn.innerHTML = '📱 Gyro Tilt: OFF <span class="hint">tilt any direction · stationary only</span>';
  }
});
/* stop sending tilt if the socket drops (robot side also decays it to 0) */
window.addEventListener("beforeunload", ()=>{ if(tiltOn) disableTilt(); });

/* --- block page scroll/zoom --- */
document.body.addEventListener("touchmove", e=>e.preventDefault(), {passive:false});

/* --- heartbeat --- */
setInterval(()=> send({type:"ping"}), 100);
</script>
</body>
</html>
